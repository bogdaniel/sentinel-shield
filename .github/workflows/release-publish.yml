# Sentinel Shield — GitHub Release publisher (+ backfill recovery path).
#
# Two entry points, one publishing path:
#   push (tags: v*)      Normal publication, immediately after a human pushes a signed tag.
#   workflow_dispatch    RECOVERY/BACKFILL for an EXISTING tag whose tag-push event never
#                        published a release (workflow added/fixed after the tag was pushed,
#                        a failed run, or notes that were not yet on the default branch).
#
# It NEVER creates, moves, or force-updates a tag, so the signed-tag airlock (the human
# holding the signing key) is preserved in both paths: the backfill can only publish a tag
# that already exists. `gh release create --verify-tag` refuses to publish otherwise, and
# publication is idempotent — an existing release is left untouched.
#
# Prerequisite: docs/<tag>-release-notes.md must exist in the tagged commit or on the default
# branch (source-tag releases tag the CI-proven engine commit, which predates the notes). A
# missing notes file FAILS the job: a release that is documented as published but has no
# GitHub Release is exactly the drift scripts/validate-release-status.sh now blocks on.
#
# Prerelease vs latest is derived from the tag suffix (-rc/-beta/-alpha).
name: release-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'EXISTING tag to publish/backfill (e.g. v2.2.0). The tag is never created or moved.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Backfill and tag-push publication of the same tag must never interleave.
  group: release-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # create the GitHub Release for the (already existing) tag
    steps:
      # `inputs.tag` is used as a checkout REF (data, not shell). It is format-validated in
      # the next step before any other use; an unknown ref simply fails the checkout.
      - name: Checkout tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0   # need the tag object + history for verification

      - name: Resolve tag, notes, and release kind
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Never interpolate an attacker-influenceable value directly into `run` (zizmor:
          # template-injection) — it arrives as an environment variable and is validated below.
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_dispatch ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # A tag name reaches `gh` and the notes path; constrain it to the release grammar
          # before it is used for anything. No slashes, no dots-dots, no shell metacharacters.
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::refusing to publish '$TAG': not a v<semver> release tag"; exit 1 ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::refusing to publish '$TAG': not a valid v<major>.<minor>.<patch>[-pre] tag"
            exit 1
          fi
          # BACKFILL SAFETY: the tag must already exist. This workflow publishes tags; it
          # never creates them.
          # NOT `|| true`. Everything below resolves the tag from the LOCAL ref store, so a
          # failed fetch means the run reads whatever stale ref the checkout happened to have
          # and calls it the release tag. An unknown ref state is not an unchanged one.
          if ! git fetch --quiet --tags --force origin; then
            echo "::error::could not fetch tags from origin — the local tag state may be stale, and a stale ref is not evidence of the tag being published; refusing to continue."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag '$TAG' does not exist — push the signed tag first; this workflow never creates tags"
            exit 1
          fi
          COMMIT=$(git rev-list -n1 "$TAG")
          # The tag must be an ANNOTATED tag object (a lightweight tag carries no signature
          # and no tagger identity), which is what the release process requires.
          if [ "$(git cat-file -t "$TAG")" != tag ]; then
            echo "::error::tag '$TAG' is a lightweight tag; the release process requires a signed annotated tag"
            exit 1
          fi
          if ! git cat-file tag "$TAG" | grep -q 'BEGIN \(PGP\|SSH\) SIGNATURE'; then
            echo "::error::tag '$TAG' carries no signature; the signed-tag airlock requires a signed annotated tag"
            exit 1
          fi
          NOTES="docs/${TAG}-release-notes.md"
          BR="${DEFAULT_BRANCH:-master}"
          # Source-tag releases tag the CI-proven engine commit, which predates the notes
          # (the notes are merged to the default branch separately). Resolve them from the
          # tagged tree first, else from the default branch. Missing notes FAIL the job —
          # silently skipping publication is what left tags without releases.
          if [ ! -f "$NOTES" ]; then
            # Fetch into an EXPLICIT ref. `FETCH_HEAD` is whatever the last fetch in this job
            # left behind — including the earlier tag fetch — so reading notes from it could
            # take them from an unintended ref. The refspec below names exactly one source.
            # `|| true` is deliberate and SAFE here, unlike on the tag fetch above: nothing
            # below reads a stale ref on failure — the `git show` immediately after is the
            # real gate and a missing notes file exits 1. The fetch is allowed to fail so the
            # error the operator sees names the missing notes rather than the fetch.
            git fetch --quiet --depth=1 origin "+refs/heads/${BR}:refs/remotes/origin/${BR}" 2>/dev/null || true
            if git show "refs/remotes/origin/${BR}:$NOTES" > "${RUNNER_TEMP}/${TAG}-notes.md" 2>/dev/null; then
              NOTES="${RUNNER_TEMP}/${TAG}-notes.md"
            else
              echo "::error::release notes for '$TAG' not found in the tagged commit or on '$BR' (expected docs/${TAG}-release-notes.md). Merge the notes, then re-run this workflow via workflow_dispatch with tag=$TAG."
              exit 1
            fi
          fi
          # Prerelease when the tag carries a pre-release suffix; GA otherwise.
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) KIND="--prerelease" ;;
            *)                      KIND="--latest" ;;
          esac
          {
            echo "tag=$TAG"
            echo "notes=$NOTES"
            echo "kind=$KIND"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Require a GitHub-verified tag signing identity
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # FAIL CLOSED. This step exists to PROVE the GitHub-side verification state, and it
          # used to `exit 0` on any API failure — a rate limit, a transient 5xx or a token
          # scope problem skipped the only signature check in the workflow and publication
          # continued. Every other integrity check here fails closed; so does this one.
          # Transient failures get three attempts before the run is refused.
          OBJ=""
          for _try in 1 2 3; do
            OBJ=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null) || OBJ=""
            if [ -n "${OBJ}" ]; then break; fi
            sleep $((_try * 5))
          done
          if [ -z "$OBJ" ]; then
            echo "::error::could not resolve the tag object for $TAG after 3 attempts. The signature-verification state is UNKNOWN, and an unknown integrity check is not a passed one — refusing to publish."
            exit 1
          fi
          # ONE call for both fields: two calls can observe inconsistent state (and double the
          # API usage against the same rate limit that made this fail open before).
          VR=""
          for _try in 1 2 3; do
            VR=$(gh api "repos/$REPO/git/tags/$OBJ" --jq '"\(.verification.verified)|\(.verification.reason)"' 2>/dev/null) || VR=""
            if [ -n "${VR}" ]; then break; fi
            sleep $((_try * 5))
          done
          if [ -z "$VR" ]; then
            echo "::error::TAG_SIGNING_IDENTITY_UNVERIFIED"
            echo "::error::the signature-verification result for tag '$TAG' could not be read after 3 attempts (empty response). A missing verification result is not a passed one — refusing to publish."
            echo "::error::  tag: $TAG / target: $OBJ / remediation: re-run once the API is reachable; if it persists, the tag is not verifiable and a new reviewed release tag is required."
            exit 1
          fi
          V=${VR%%|*}
          R=${VR#*|}
          # The TAGGER, when GitHub can name one, plus whether signature material is present.
          # This is deliberately NOT called the signer: `.tagger` is who authored the tag
          # object, which the API does not prove is the identity that signed it. Reporting it
          # as "signer" presented unauthenticated metadata as signing authorization.
          TAGGER=$(gh api "repos/$REPO/git/tags/$OBJ" \
            --jq '"\(.verification.signature // "" | if . == "" then "none" else "present" end)/\(.tagger.name // "unknown") <\(.tagger.email // "unknown")>"' 2>/dev/null) || TAGGER="unavailable"
          # A malformed API response is not a verified tag. `verified` is a JSON boolean; jq
          # renders anything else (null, absent, a string) as something other than `true`
          # or `false`, and only the literal `true` publishes.
          case "$V" in
            true)
              # A verified SIGNATURE on object B says nothing about commit A. The verified
              # object must peel to exactly the commit this run publishes, or a tag moved
              # between the local checkout and this API read would be published with someone
              # else's verification standing behind it.
              PEEL="$OBJ"; PTYPE="tag"; PSHA=""
              _hop=0
              while [ "$PTYPE" = "tag" ] && [ "$_hop" -lt 5 ]; do
                PR_=""
                for _try in 1 2 3; do
                  PR_=$(gh api "repos/$REPO/git/tags/$PEEL" --jq '"\(.object.type)|\(.object.sha)"' 2>/dev/null) || PR_=""
                  if [ -n "${PR_}" ]; then break; fi
                  sleep $((_try * 5))
                done
                if [ -z "$PR_" ]; then
                  echo "::error::TAG_TARGET_UNRESOLVED"
                  echo "::error::the verified tag object $PEEL could not be peeled to a commit after 3 attempts — an unresolved target is not a matching one; refusing to publish."
                  exit 1
                fi
                PTYPE=${PR_%%|*}; PSHA=${PR_#*|}; PEEL="$PSHA"
                _hop=$((_hop + 1))
              done
              if [ "$PTYPE" != "commit" ] || [ -z "$PSHA" ]; then
                echo "::error::TAG_TARGET_UNRESOLVED"
                echo "::error::tag $TAG does not peel to a commit (last object type: ${PTYPE:-unknown}) — refusing to publish."
                exit 1
              fi
              if [ "$PSHA" != "$COMMIT" ]; then
                echo "::error::TAG_TARGET_COMMIT_MISMATCH"
                echo "::error::the VERIFIED tag object does not point at the commit this run publishes. The tag ref moved between the checkout and this verification, so the signature that was verified belongs to a different commit."
                echo "::error::  tag:                 $TAG"
                echo "::error::  verified tag object: $OBJ"
                echo "::error::  object peels to:     $PSHA"
                echo "::error::  publishing commit:   $COMMIT"
                echo "::error::  remediation:         release tags are immutable — do NOT move or re-push this tag. Investigate who changed it, then cut a NEW reviewed tag."
                echo "::error::  reference:           docs/production-release-runbook.md#tag_signing_identity_unverified--publication-refused"
                exit 1
              fi
              echo "tag $TAG: signing identity GitHub-verified (target $OBJ -> commit $PSHA, tagger $TAGGER)"
              if [ -n "${GITHUB_OUTPUT:-}" ]; then
                printf 'obj=%s\n' "$OBJ" >> "$GITHUB_OUTPUT"
              fi
              exit 0 ;;
            false) : ;;
            *)
              echo "::error::TAG_SIGNING_IDENTITY_UNVERIFIED"
              echo "::error::the GitHub verification response for tag '$TAG' is missing or malformed (verified='$V', reason='$R'). An unreadable integrity check is not a passed one — refusing to publish."
              exit 1 ;;
          esac
          # NOT verified. THERE IS NO EXCEPTION PATH. `unknown_key` and
          # `unknown_signature_type` mean the tag carries signature BYTES that GitHub cannot
          # attribute to an approved signing identity — signature material is not release
          # authorization, so this blocks exactly like a bad signature. An existing tag in this
          # state stays immutable: register the signing key and re-run publication, or cut a
          # NEW reviewed release tag. Never move, re-sign or replace the old one.
          echo "::error::TAG_SIGNING_IDENTITY_UNVERIFIED"
          echo "::error::The tag contains signature material, but GitHub cannot attribute it to an approved signing identity. Register the signing key and rerun publication."
          echo "::error::  tag:                 $TAG"
          echo "::error::  tag target:          $OBJ"
          echo "::error::  published commit:    ${COMMIT:-unknown}"
          echo "::error::  verification.verified: $V"
          echo "::error::  verification.reason:   $R"
          echo "::error::  tagger:              $TAGGER"  # tag author, NOT proof of the signer
          echo "::error::  remediation:         register the public signing key on the account that signed this tag (GitHub -> Settings -> SSH and GPG keys), then re-run this workflow via workflow_dispatch with tag=$TAG. If the key cannot be registered or recovered, cut a NEW reviewed release tag — do NOT move, re-sign or replace '$TAG'."
          echo "::error::  reference:           docs/production-release-runbook.md#tag_signing_identity_unverified--publication-refused"
          exit 1

      - name: Require an enforced, non-bypassable tag ruleset
        # The final ref check and `gh release create --verify-tag` are SEPARATE API operations:
        # `create` resolves the tag NAME again, and nothing binds that resolution to the object
        # this run verified. A writer able to move `refs/tags/<tag>` in the interval between
        # them could therefore have a release published for a target nobody verified. Narrowing
        # that window is not closing it.
        #
        # What closes it is the repository refusing the move at all. This step proves, BEFORE
        # publication, that an ACTIVE tag ruleset covers this exact tag, restricts both updates
        # and deletions, and has no bypass that could be used to retarget it during the run.
        # Everything here fails closed: an API error, a missing permission, a rule whose detail
        # cannot be read, or bypass actors that cannot be inspected are all "protection NOT
        # proven", never "protection present".
        env:
          # NOT ${{ github.token }}. GitHub omits `bypass_actors` from the ruleset payload
          # unless the caller has ruleset write access, and GITHUB_TOKEN cannot hold it — so
          # with the default token this step could never pass, whatever the repository is
          # actually configured to do. A check that is impossible to satisfy is not a
          # fail-closed check; it is a broken one, and the pressure it creates is to delete it.
          #
          # Supply a token that CAN read the ruleset: a GitHub App installation token for an
          # app with Administration: read, or a protected PAT. It is used ONLY for this
          # read-only inspection; publication itself continues to use github.token.
          GH_TOKEN: ${{ secrets.SENTINEL_SHIELD_RULESET_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          fail() {
            echo "::error::TAG_PROTECTION_UNPROVEN"
            echo "::error::$1"
            echo "::error::  tag:        $TAG"
            echo "::error::  repository: $REPO"
            echo "::error::  required:   an ACTIVE tag ruleset covering refs/tags/$TAG with BOTH"
            echo "::error::              'update' and 'deletion' restrictions and no bypass actor"
            echo "::error::              able to retarget the tag during publication."
            echo "::error::  reference:  docs/production-release-runbook.md#tag_protection_unproven--publication-refused"
            exit 1
          }

          # The token has to be able to SEE bypass actors, or every answer below is "unknown".
          # Saying so here, once, beats failing later with a message that looks like a
          # repository misconfiguration when it is really a missing credential.
          [ -n "${GH_TOKEN:-}" ] || fail "no SENTINEL_SHIELD_RULESET_TOKEN secret is configured. GitHub omits 'bypass_actors' unless the caller has ruleset write access, which the default GITHUB_TOKEN cannot have, so tag protection cannot be proven with it. Configure a GitHub App installation token (Administration: read) or a protected PAT as the SENTINEL_SHIELD_RULESET_TOKEN secret; it is used only for this read-only inspection."

          # ---- list the rulesets (with parents: an org-level ruleset protects too) ----------
          RS=""
          for _try in 1 2 3; do
            RS=$(gh api "repos/$REPO/rulesets?includes_parents=true" 2>/dev/null) || RS=""
            if [ -n "$RS" ]; then break; fi
            sleep $((_try * 5))
          done
          [ -n "$RS" ] || fail "the repository rulesets could not be read after 3 attempts. Protection that cannot be inspected is not protection that exists."
          printf '%s' "$RS" | jq -e 'type == "array"' >/dev/null 2>&1 \
            || fail "the rulesets response was not a list; the protection state is unknown."

          REF="refs/tags/$TAG"
          # ---- find every ACTIVE ruleset that targets tags and covers THIS tag --------------
          # `~ALL` covers everything; otherwise fnmatch against the include patterns, minus any
          # exclude that also matches.
          MATCHED=""
          for _id in $(printf '%s' "$RS" | jq -r '.[] | select((.target // "") == "tag") | .id'); do
            DET=""
            for _try in 1 2 3; do
              DET=$(gh api "repos/$REPO/rulesets/$_id?includes_parents=true" 2>/dev/null) || DET=""
              if [ -n "$DET" ]; then break; fi
              sleep $((_try * 5))
            done
            [ -n "$DET" ] || fail "tag ruleset $_id could not be read after 3 attempts; its rules and bypass actors are unknown."

            _enf=$(printf '%s' "$DET" | jq -r '(.enforcement // "")')
            # A ruleset in `disabled` or `evaluate` mode reports violations; it does not prevent
            # them. Only `active` actually refuses the move.
            [ "$_enf" = "active" ] || continue

            _covers=$(printf '%s' "$DET" | jq -r --arg ref "$REF" '
              (.conditions.ref_name.include // []) as $inc
              | (.conditions.ref_name.exclude // []) as $exc
              # The pattern is BOUND first: inside `$ref | test(… . …)` the pipe rebinds `.`
              # to $ref, so the pattern would be compared against itself and every ruleset
              # would appear to cover every tag.
              # GitHub ref-name patterns are fnmatch, not regex, so the pattern is translated
              # rather than pasted in. Escaping only `.` left every OTHER regex metacharacter
              # live: `+`, `?`, `(`, `)`, `[`, `]`, `^`, `$`, `|`, `{`, `}` in a pattern were
              # interpreted instead of matched, so a ruleset could appear to cover a tag it
              # does not (or fail to cover one it does). Each metacharacter is escaped first,
              # then only the glob operators are translated back:
              #   **  -> .*      (crosses `/`)
              #   *   -> [^/]*   (does not cross `/`)
              #   ?   -> [^/]
              | def fn: . as $p
                  | ($p | gsub("(?<c>[.+?()\\[\\]^$|{}\\\\])"; "\\" + .c))
                  | gsub("\\*\\*"; "\u0001") | gsub("\\*"; "[^/]*") | gsub("\u0001"; ".*")
                  | gsub("\\\\\\?"; "[^/]");
                def m($pats): any($pats[]; . as $p
                  | $p == "~ALL" or $p == $ref
                  or ($ref | test("^" + ($p | fn) + "$")));
                if (m($inc)) and ((($exc | length) == 0) or (m($exc) | not)) then "yes" else "no" end' 2>/dev/null || printf 'error')
            [ "$_covers" = "yes" ] || { [ "$_covers" = "error" ] && fail "the ref conditions of tag ruleset $_id could not be evaluated."; continue; }

            # ---- BOTH restrictions, not one ------------------------------------------------
            _rules=$(printf '%s' "$DET" | jq -r '[ (.rules // [])[] | .type ] | join(" ")' 2>/dev/null || printf '')
            [ -n "$_rules" ] || fail "tag ruleset $_id lists no rule details; a ruleset whose rules cannot be read proves nothing."
            case " $_rules " in *" update "*) : ;; *) continue ;; esac
            case " $_rules " in *" deletion "*) : ;; *) continue ;; esac

            # ---- bypass actors: ABSENCE IS NOT EMPTINESS -----------------------------------
            # GitHub omits `bypass_actors` unless the caller has write access to the ruleset.
            # An absent field therefore means the bypasses could not be inspected — which is
            # exactly the state this check exists to rule out.
            _has_bypass_field=$(printf '%s' "$DET" | jq -r 'has("bypass_actors")' 2>/dev/null || printf 'false')
            [ "$_has_bypass_field" = "true" ] \
              || fail "tag ruleset $_id does not expose 'bypass_actors' to this token. GitHub omits that field without write access to the ruleset, so the bypasses CANNOT be inspected — this is unproven protection, not an absence of bypasses. Grant the publisher permission to read the ruleset, or publish from a context that can."
            _always=$(printf '%s' "$DET" | jq -r '
              [ (.bypass_actors // [])[] | select((.bypass_mode // "") == "always")
                | "\(.actor_type // "?"):\(.actor_id // "?")" ] | join(" ")' 2>/dev/null || printf 'error')
            [ "$_always" = "error" ] && fail "the bypass actors of tag ruleset $_id could not be evaluated."
            if [ -n "$_always" ]; then
              fail "tag ruleset $_id grants an ALWAYS bypass to: $_always. Any of those actors — the publishing workflow, a GitHub App, a repository role, a team or an administrator — could retarget the tag between the final verification and the release-creation call, which is the interval this ruleset is required to close."
            fi
            MATCHED="$MATCHED $_id"
          done

          [ -n "$MATCHED" ] || fail "no ACTIVE tag ruleset covers $REF with both 'update' and 'deletion' restrictions. Without it the tag can be moved between the final verification and the release-creation call."
          echo "tag protection proven: active, non-bypassable ruleset(s)$MATCHED restrict updates and deletions for $REF"
      - name: Create GitHub Release (verifies the pushed tag)
        # Pass step outputs via env (NOT inline ${{ }} in run) so they cannot expand
        # into the shell as code — a tag name is attacker-influenceable. (zizmor: template-injection)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES: ${{ steps.meta.outputs.notes }}
          KIND: ${{ steps.meta.outputs.kind }}
          REPO: ${{ github.repository }}
          VERIFIED_OBJ: ${{ steps.verify.outputs.obj }}
        run: |
          set -eu
          # LAST-MOMENT REF CHECK. Verification happened in an earlier step; `gh release
          # create --verify-tag` acts on the tag as it exists NOW. Between the two, a tag ref
          # can be moved or replaced, and the post-publication commit check would then detect
          # the mismatch only AFTER a wrong release exists. Publication must not begin unless
          # the ref still resolves to the exact object that was verified.
          if [ -z "${VERIFIED_OBJ:-}" ]; then
            echo "::error::TAG_VERIFICATION_MISSING"
            echo "::error::the verification step published no tag object, so there is nothing to re-check against — refusing to publish."
            exit 1
          fi
          NOWOBJ=""
          for _try in 1 2 3; do
            NOWOBJ=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null) || NOWOBJ=""
            if [ -n "${NOWOBJ}" ]; then break; fi
            sleep $((_try * 5))
          done
          if [ -z "$NOWOBJ" ]; then
            echo "::error::TAG_REF_UNRESOLVED"
            echo "::error::the tag ref for $TAG could not be re-read before publication — an unknown ref state is not an unchanged one; refusing to publish."
            exit 1
          fi
          # The verification STATE can change too, not only the ref: a signing key can be
          # removed or revoked between the check and the write. Re-read the verdict for the
          # same object and require it to still be `true`.
          NOWV=""
          for _try in 1 2 3; do
            NOWV=$(gh api "repos/$REPO/git/tags/$VERIFIED_OBJ" --jq '.verification.verified' 2>/dev/null) || NOWV=""
            if [ -n "$NOWV" ]; then break; fi
            sleep $((_try * 5))
          done
          if [ "$NOWV" != "true" ]; then
            echo "::error::TAG_SIGNING_IDENTITY_UNVERIFIED"
            echo "::error::the signing identity for $TAG no longer verifies at publication time (verified='${NOWV:-unreadable}'). It verified during the earlier check, so the key was revoked, removed or became unreadable in between — refusing to publish."
            echo "::error::  tag:             $TAG"
            echo "::error::  verified object: $VERIFIED_OBJ"
            echo "::error::  remediation:     re-register the signing key and re-run, or cut a NEW reviewed release tag. Do NOT move or re-push this one."
            exit 1
          fi
          if [ "$NOWOBJ" != "$VERIFIED_OBJ" ]; then
            echo "::error::TAG_REF_MOVED"
            echo "::error::the tag ref changed between verification and publication. Nothing about the new object has been verified, so publishing it would attach an unverified target to a release."
            echo "::error::  tag:             $TAG"
            echo "::error::  verified object: $VERIFIED_OBJ"
            echo "::error::  ref now points:  $NOWOBJ"
            echo "::error::  remediation:     release tags are immutable — do NOT move or re-push a published tag. Investigate the change, then cut a NEW reviewed tag."
            exit 1
          fi
          # Idempotent: if a human already published this tag manually, do not fail. This is
          # what makes the backfill path safe to re-run.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as-is (idempotent)."
            exit 0
          fi
          # shellcheck disable=SC2086
          if ! gh release create "$TAG" \
              --repo "$REPO" \
              --verify-tag \
              --title "Sentinel Shield $TAG" \
              --notes-file "$NOTES" \
              $KIND; then
            # A concurrent publisher may have created it between the check and now.
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release $TAG was created concurrently; treating as success."
              exit 0
            fi
            exit 1
          fi

      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          STAGE=ga
          case "$TAG" in *-rc*) STAGE=rc ;; *-beta*) STAGE=beta ;; *-alpha*) STAGE=alpha ;; esac
          sh scripts/verify-published-release.sh verify-github-release \
            --tag "$TAG" \
            --stage "$STAGE" \
            --repo "$REPO" \
            --expected-commit "$COMMIT"
