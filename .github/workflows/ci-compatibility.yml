# Sentinel Shield — production compatibility & support-matrix enforcement.
#
# Proves the canonical compatibility policy (config/compatibility-policy.json) and its
# fail-closed gate (scripts/health.sh) behave identically and deterministically across the
# supported runner images, and that unsupported configurations FAIL with stable diagnostics
# rather than incidental command errors. Every step fails CLOSED: a non-green deterministic
# suite, or an unexpected health exit code, fails the job. No advisory-only / continue-on-error
# steps. Third-party actions are pinned by immutable full commit SHA
# (docs/github-actions-security.md). Cost is bounded: a single blocking unit job, a small
# REPRESENTATIVE pairwise matrix on every PR/push, and the FULL runner-image matrix only on a
# schedule / manual dispatch.
name: ci-compatibility

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Nightly full matrix (UTC). Keeps the supported-runner-image list honest as GitHub
    # rotates images, without paying the full cost on every PR.
    - cron: '27 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Key on event_name too: without it, a master push and the nightly `schedule` full-matrix
  # run share a group and cancel-in-progress silently drops the only run of the full
  # runner-image matrix (or vice versa), losing nightly coverage.
  group: ci-compatibility-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # (1) Deterministic, network-free policy + gate contract. BLOCKING on every event.
  compat-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure jq
        run: command -v jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Shell syntax (compatibility scripts)
        run: |
          for f in scripts/health.sh scripts/lib/compatibility-policy.sh scripts/report-compatibility-matrix.sh tests/prod/260-compatibility-policy.sh; do
            sh -n "$f" || exit 1
          done

      - name: Policy conforms to its schema (structural)
        run: |
          jq -e . config/compatibility-policy.json >/dev/null
          jq -e . schemas/compatibility-policy.schema.json >/dev/null

      - name: Compatibility policy + gate contract (BLOCKING)
        run: sh tests/prod/260-compatibility-policy.sh

      - name: Independent host-coverage probe (compatibility gate)
        run: |
          mkdir -p reports
          # The live compatibility gate independently verifies THIS runner against the policy.
          # A pass (exit < 2 = supported/degraded) proves every mandatory component is present,
          # so it becomes the coverage evidence; a hard fail (>= 2) leaves coverage empty and the
          # matrix report then fails closed rather than trivially passing on the policy alone.
          rc=0
          sh scripts/health.sh --policy config/compatibility-policy.json || rc=$?
          echo "compatibility gate exit=$rc on $(uname -s)/$(uname -m)"
          if [ "$rc" -lt 2 ]; then
            jq -c '[.components | to_entries[] | select(.value.mandatory == true) | .key]' \
              config/compatibility-policy.json > reports/compat-coverage.json
          else
            echo '[]' > reports/compat-coverage.json
          fi

      - name: Generate compatibility-matrix report (release evidence)
        run: |
          sh scripts/report-compatibility-matrix.sh \
            --source-commit "${GITHUB_SHA}" \
            --coverage reports/compat-coverage.json \
            --output reports/compatibility-matrix.json

      - name: Upload compatibility-matrix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-shield-compatibility-matrix
          path: reports/compatibility-matrix.json
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # (2) REPRESENTATIVE pairwise matrix on every PR/push. Each row injects a synthetic
  #     environment via SENTINEL_SHIELD_COMPAT_* and asserts the gate's exact exit code —
  #     deterministic, network-free, no extra toolchain actions needed. Bounded (<=6 rows).
  compat-representative:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported low / high corners (pairwise coverage of os x shell x pm x runtime).
          - name: linux-min
            os_id: linux
            arch: x86_64
            shell: sh
            node: '18.0'
            npm: '8.0'
            php: '8.1'
            expect_rc: '0'
          - name: macos-high
            os_id: macos
            arch: arm64
            shell: zsh
            node: '22.11'
            npm: '11.0'
            php: '8.4'
            expect_rc: '0'
          # Unsupported corners must FAIL closed (exit 3).
          - name: unsupported-shell
            os_id: linux
            arch: x86_64
            shell: fish
            node: '20.11'
            npm: '10.9'
            php: '8.2'
            expect_rc: '3'
          - name: unsupported-arch
            os_id: linux
            arch: s390x
            shell: bash
            node: '20.11'
            npm: '10.9'
            php: '8.2'
            expect_rc: '3'
          - name: unsupported-node
            os_id: linux
            arch: x86_64
            shell: bash
            node: '16.20'
            npm: '10.9'
            php: '8.2'
            expect_rc: '3'
          - name: unsupported-npm-major
            os_id: linux
            arch: x86_64
            shell: bash
            node: '20.11'
            npm: '7.9'
            php: '8.2'
            expect_rc: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure jq
        run: command -v jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Assert gate exit code for '${{ matrix.name }}'
        env:
          SENTINEL_SHIELD_COMPAT_OS: ${{ matrix.os_id }}
          SENTINEL_SHIELD_COMPAT_ARCH: ${{ matrix.arch }}
          SENTINEL_SHIELD_COMPAT_SHELL: ${{ matrix.shell }}
          SENTINEL_SHIELD_COMPAT_NODE_VERSION: ${{ matrix.node }}
          SENTINEL_SHIELD_COMPAT_NPM_VERSION: ${{ matrix.npm }}
          SENTINEL_SHIELD_COMPAT_PHP_VERSION: ${{ matrix.php }}
          SENTINEL_SHIELD_COMPAT_FS_CASE: sensitive
          EXPECT_RC: ${{ matrix.expect_rc }}
          CASE_NAME: ${{ matrix.name }}
        run: |
          # THE EXIT-4 CONTRACT OF THIS MATRIX (#306 acceptance criterion 4).
          #
          # This job asserts a CLASSIFICATION: given a pinned environment, the gate must reach
          # a specific verdict. Exit 4 is not one of those verdicts — it means a bounded
          # version probe timed out and the gate therefore classified NOTHING. Comparing it to
          # expect_rc reports "expected exit 3 but got 4", i.e. a compatibility mismatch for a
          # judgement the gate never made. That is how the 2026-08-07 nightly read, and it is
          # the wrong description of what happened.
          #
          # An environmental non-verdict is also NOT a pass: a permanently wedged probe must
          # never turn this matrix green. So a non-verdict is re-probed once — a timeout is
          # transient by definition, and if it is not, one more attempt costs seconds and
          # proves it — and a second non-verdict fails the job under its OWN diagnostic,
          # naming the runner rather than the compatibility policy.
          #
          # The expect_rc assertion itself is UNCHANGED and still applies, unweakened, to every
          # verdict the gate does produce (including exit 4 itself, should a case ever pin it).
          attempt=1
          while :; do
            rc=0
            sh scripts/health.sh --policy config/compatibility-policy.json || rc=$?
            echo "gate exit=$rc expected=$EXPECT_RC (attempt $attempt)"
            if [ "$rc" != 4 ] || [ "$EXPECT_RC" = 4 ]; then break; fi
            if [ "$attempt" -ge 2 ]; then
              echo "COMPAT UNVERIFIABLE: '$CASE_NAME' — a bounded probe timed out on both attempts, so the gate produced NO classification (exit 4)."
              echo "  This is an environmental failure of the runner, not a compatibility verdict, and NOT a mismatch against the expected exit $EXPECT_RC."
              exit 1
            fi
            attempt=$((attempt + 1))
          done
          if [ "$rc" != "$EXPECT_RC" ]; then
            echo "COMPAT MISMATCH: '$CASE_NAME' expected exit $EXPECT_RC but got $rc"
            exit 1
          fi

  # --------------------------------------------------------------------------
  # (3) FULL runner-image matrix. Scheduled / manual only (bounded cost). Runs the gate
  #     LIVE against the real image plus the deterministic suite, proving each SUPPORTED
  #     image is on a supported OS/arch/shell/toolchain. A live gate result of 0 (supported)
  #     or 1 (degraded, e.g. macOS case-insensitive FS) is acceptable; >=2 fails the job.
  compat-full-matrix:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu-22.04
          - ubuntu-24.04
          - macos-14
          - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if command -v brew >/dev/null 2>&1; then brew install jq; else sudo apt-get update && sudo apt-get install -y jq; fi
          fi

      - name: Deterministic policy + gate contract (BLOCKING)
        run: sh tests/prod/260-compatibility-policy.sh

      - name: Live compatibility gate on ${{ matrix.image }} (supported or degraded only)
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          # Same exit-4 contract as compat-representative (#306 AC4): a probe timeout is an
          # environmental non-verdict about the runner, not a support judgement about the
          # image. It is reported as such and still fails the job — never silently tolerated.
          rc=0
          sh scripts/health.sh --policy config/compatibility-policy.json || rc=$?
          echo "live gate exit=$rc on $IMAGE"
          if [ "$rc" = 4 ]; then
            echo "runner image $IMAGE is UNVERIFIABLE (gate exit 4): a bounded version probe timed out, so the gate reached no support verdict."
            echo "  This is a runner/environment failure, not evidence that $IMAGE is unsupported."
            exit 1
          fi
          if [ "$rc" -ge 2 ]; then
            echo "runner image $IMAGE is UNSUPPORTED (gate exit $rc) — see FAIL lines above"
            exit 1
          fi
