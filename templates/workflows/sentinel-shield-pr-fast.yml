# Sentinel Shield — PR FAST GATE (v0.1.12). Fast, deterministic, no external target scanning.
# === MANAGED BY SENTINEL SHIELD === installed/synced via install-baseline.sh / sync-baseline.sh.
# Tools ACTUALLY run by this workflow: php -l, PHPStan, npm audit, Semgrep (curated),
# Hadolint, GH Actions pin audit, Docker base digest, dependency policy. Psalm/Pint/ESLint/
# tsc run ONLY if the steps below are wired for a configured project.
# NOTE: Gitleaks (secrets), actionlint and zizmor are NOT run here — they run in the separate
# security workflow (ci-security.yml). This PR-fast gate is NOT the secrets gate.
# Enforces the project's profile mode.
name: sentinel-shield-pr-fast
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Cancel superseded PR-fast runs when new commits arrive on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SENTINEL_SHIELD_REPOSITORY: YOUR_ORG/sentinel-shield   # TODO set
  SENTINEL_SHIELD_REF: v2.2.0                            # pin to a full SHA before production
  SENTINEL_SHIELD_PATH: tools/sentinel-shield
  # NOTE: this template runs Semgrep only. gitleaks / actionlint / zizmor run in the main and
  # scheduled gates, so their image variables are deliberately NOT declared here — overriding
  # SENTINEL_SHIELD_GITLEAKS_IMAGE in this file would have no effect because nothing reads it.
  # Semgrep scanner image — DIGEST-pinned by default (config/scanner-images.json). The trailing
  # comment records the readable tag the digest was resolved from; see
  # docs/scanner-image-digest-pinning.md. Override the variable to run a different build.
  SENTINEL_SHIELD_SEMGREP_IMAGE: semgrep/semgrep@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b   # 1.165.0
jobs:
  pr-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false }
      - name: Checkout Sentinel Shield
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.SENTINEL_SHIELD_REPOSITORY }}
          ref: ${{ env.SENTINEL_SHIELD_REF }}
          path: ${{ env.SENTINEL_SHIELD_PATH }}
          persist-credentials: false
      - name: Resolve gates
        run: sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/resolve-gates.sh --profile .sentinel-shield/profile.yaml --output-dir reports --format all
      - name: PHP fast checks (best-effort; never fake)
        run: |
          mkdir -p reports/raw
          # composer audit is REQUIRED at `pr` by every PHP profile; without it the PR plan
          # records the dependency-advisory channel as unavailable.
          if [ -f composer.json ]; then
            composer install --no-interaction --no-progress --prefer-dist --no-scripts || true
            composer audit --format=json > reports/raw/composer-audit.json 2>/dev/null || true
          fi
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/runners/php-syntax.sh reports/raw/php-syntax.json || true
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/runners/laravel-phpstan.sh || true
          # TODO (optional, NOT wired): Psalm / Pint / PHP-CS-Fixer — add the runner calls here if
          # your project configures them; write reports/raw/{psalm,php-style}.json.
      - name: Node fast checks
        run: |
          npm ci || true
          npm audit --json > reports/raw/npm-audit.json 2>/dev/null || true
          # TODO (optional, NOT wired): tsc --noEmit + eslint — add the commands here if your
          # project configures them; write reports/raw/{typescript,eslint}.json.
      - name: GH Actions + Docker lint + dependency policy
        run: |
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/run-hadolint.sh || true
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/audit-github-actions-pins.sh --output reports/raw/github-actions-pins.json || true
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/audit-docker-base-digest.sh --output reports/raw/docker-base-digest.json || true
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/audits/dependency-policy.sh reports/raw/dependency-policy.json . || true
      - name: Semgrep app scan — CURATED Sentinel Shield rules (NEVER --config=auto)
        # Validated on zenchron-tools (run 27170148123): curated rules produced 0 critical / 0
        # high (vs 7/16 with --config=auto) and far fewer scan errors. The project .semgrepignore
        # is honored via `-w /src`. Do NOT switch to --config=auto in production — it is noisy.
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${SENTINEL_SHIELD_SEMGREP_IMAGE:-semgrep/semgrep@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b}" \
            semgrep --json --output /src/reports/raw/semgrep.json \
            --config /src/${{ env.SENTINEL_SHIELD_PATH }}/semgrep/app || true
      - name: Gitleaks secrets (pinned image → reports/raw/gitleaks.json)
        # `secrets` is a NON-SUPPRESSIBLE control and every profile marks gitleaks required at
        # `pr`. It used to be left to the engine's own ci-security.yml, which a CONSUMER does
        # not have — so a consumer's PR plan had no secrets producer at all.
        continue-on-error: true
        run: |
          mkdir -p reports/raw
          docker run --rm -v "$PWD:/repo" "${SENTINEL_SHIELD_GITLEAKS_IMAGE:-zricethezav/gitleaks:v8.18.4}" \
            detect --source=/repo --report-format json \
            --report-path /repo/reports/raw/gitleaks.json --redact || true
      - name: OSV-Scanner (SHA-pinned action → reports/raw/osv-scanner.json)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --format=json
            --output=reports/raw/osv-scanner.json
            --recursive
            ./
        continue-on-error: true
      - name: Build summary + enforce
        run: |
          set -eu
          # Same fallback as the run-tool-plan step above: an EMPTY --profile silently drops
          # the whole tool-policy overlay, so --stage would be inert and required-tool
          # enforcement would vanish. Re-deriving it without the fallback is how that
          # happened; without `set -eu` a failed extraction or a failed build then let
          # enforce-gates run against a stale or missing summary.
          # The effective profile decides which producers are required and which gates
          # enforce, so it is NEVER guessed. A duplicated key is ambiguous rather than
          # first-wins, and a missing one is a configuration failure — silently running
          # `laravel-react-docker` would prove coverage for one profile while enforcing a
          # different stack.
          _pt_n=$(grep -cE '^SENTINEL_SHIELD_PROJECT_TYPE=' reports/sentinel-shield-gates.env 2>/dev/null || printf '0')
          case "$_pt_n" in '' | *[!0-9]*) _pt_n=0 ;; esac
          if [ "$_pt_n" -ne 1 ]; then
            echo "::error::gate resolution declares SENTINEL_SHIELD_PROJECT_TYPE $_pt_n times in reports/sentinel-shield-gates.env; exactly one is required. Zero means the profile is unresolved; more than one is ambiguous policy."
            exit 2
          fi
          PROFILE=$(grep -E '^SENTINEL_SHIELD_PROJECT_TYPE=' reports/sentinel-shield-gates.env | sed 's/^SENTINEL_SHIELD_PROJECT_TYPE=//')
          if [ -z "$PROFILE" ]; then
            echo "::error::SENTINEL_SHIELD_PROJECT_TYPE is empty in reports/sentinel-shield-gates.env — the effective profile cannot be guessed."
            exit 2
          fi
          # --stage is INERT without --profile: the stage-applicability column is computed
          # only inside the effective-profile overlay, so without it there is no policy
          # overlay, no required_tool_failures, and --stage pr changes nothing.
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/build-security-summary.sh --profile "$PROFILE" --stage pr --target . --raw-dir reports/raw --output reports/security-summary.json
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/enforce-gates.sh --summary reports/security-summary.json --gates-env reports/sentinel-shield-gates.env --output-dir reports --format all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()   # preserve raw reports even when the gate fails on real findings
        with: { name: sentinel-shield-pr-fast, path: reports/**, retention-days: 30, if-no-files-found: warn }
