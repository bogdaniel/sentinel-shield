# Sentinel Shield — MAIN BRANCH GATE (split template). Heavier but deterministic; trusted branch.
#
# This is the per-job alternative to the combined `sentinel-shield.yml` main-gate job, and it
# must stay EQUIVALENT to it: scripts/verify-producer-coverage.sh fails the build when either
# variant lacks a producer for a report its profile marks REQUIRED at `main`. It previously
# produced only Syft/OSV/Grype/IaC evidence while every profile also requires Semgrep,
# Gitleaks, Trivy-fs, the dependency advisories and the tool plan — a fresh install of the
# split templates therefore exited 3 on a wiring gap rather than on findings.
#
# OWASP Dependency-Check is deliberately NOT run here: it needs the NVD dataset (large, rate
# limited, API key) and a warm persistent cache, so its home is the nightly workflow
# (sentinel-shield-scheduled.yml / sentinel-shield-dependency-check.yml). The profiles mark it
# required at the `scheduled` stage, not at `main`.
#
# FIRST-TIME VALIDATION (v0.1.17). This workflow is workflow_dispatch + push only, so it cannot be
# dispatched from a feature branch until it already exists on the default branch (chicken-and-egg).
# Do NOT merge it unvalidated. Validate the SAME main-gate scanners from a branch/PR first with the
# branch-safe harness (no dispatch, no merge required):
#   sh scripts/run-main-gate-validation.sh --target . --output-dir reports/raw --all
# Then build/resolve/enforce and review the real reports/raw/*. Only after that is green should this
# workflow be merged to the default branch, where workflow_dispatch/push take over. See
# docs/main-gate-validation-strategy.md.
name: sentinel-shield-main
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read   # CodeQL runs with upload:false, so no security-events write is needed
# Release-gate runs must complete. Group per COMMIT (not per ref) so a newer push
# never supersedes/drops a queued gate for an earlier commit — each commit is gated
# to completion; only redundant re-runs of the SAME sha dedupe, never cancelling
# an in-flight gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false
env:
  SENTINEL_SHIELD_REPOSITORY: YOUR_ORG/sentinel-shield   # TODO set
  SENTINEL_SHIELD_REF: v2.2.0                            # pin to a full SHA before production
  SENTINEL_SHIELD_PATH: tools/sentinel-shield
  # Scanner images — DIGEST-pinned by default (config/scanner-images.json); the trailing
  # comment records the readable tag each digest was resolved from. See
  # docs/scanner-image-digest-pinning.md.
  SENTINEL_SHIELD_GRYPE_IMAGE: anchore/grype@sha256:7a9fc7f89ccef78ae5a7691a115d3f0d41b1f319d589dd8cc1dcb9ab3f01dd28   # v0.114.0
  SENTINEL_SHIELD_SEMGREP_IMAGE: semgrep/semgrep@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b   # 1.165.0
  SENTINEL_SHIELD_GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba   # v8.18.4
jobs:
  main-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false }
      - name: Checkout Sentinel Shield
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.SENTINEL_SHIELD_REPOSITORY }}
          ref: ${{ env.SENTINEL_SHIELD_REF }}
          path: ${{ env.SENTINEL_SHIELD_PATH }}
          persist-credentials: false
      - name: Resolve gates (profile -> reports/sentinel-shield-gates.env)
        run: |
          set -eu
          mkdir -p reports
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/resolve-gates.sh --profile .sentinel-shield/profile.yaml --output-dir reports --format all
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install project dependencies (best-effort) + dependency advisories
        run: |
          set -eu
          mkdir -p reports/raw
          if [ -f composer.json ]; then
            composer install --no-interaction --no-progress --prefer-dist --no-scripts || true
            composer audit --format=json > reports/raw/composer-audit.json 2>/dev/null || true
          fi
          if [ -f package.json ]; then
            npm ci || true
            npm audit --json > reports/raw/npm-audit.json 2>/dev/null || true
          fi
      - name: Semgrep SAST (digest-pinnable image → reports/raw/semgrep.json)
        run: |
          mkdir -p reports/raw
          docker run --rm -v "$PWD:/src" -w /src "${SENTINEL_SHIELD_SEMGREP_IMAGE}" \
            semgrep --json --output /src/reports/raw/semgrep.json \
            --config /src/${{ env.SENTINEL_SHIELD_PATH }}/semgrep/app || true
        continue-on-error: true
      - name: Gitleaks secrets (pinned image → reports/raw/gitleaks.json)
        run: |
          mkdir -p reports/raw
          docker run --rm -v "$PWD:/repo" "${SENTINEL_SHIELD_GITLEAKS_IMAGE}" \
            detect --source=/repo --report-format json \
            --report-path /repo/reports/raw/gitleaks.json --redact || true
        continue-on-error: true
      - name: Trivy filesystem (SHA-pinned action → reports/raw/trivy-fs.json)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: reports/raw/trivy-fs.json
          severity: CRITICAL,HIGH,MEDIUM
        continue-on-error: true
      - name: SBOM (SHA-pinned action → reports/sbom.spdx.json)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: reports/sbom.spdx.json
        continue-on-error: true
      - name: SBOM for the tool plan (syft-json → reports/raw/syft.json)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: syft-json
          output-file: reports/raw/syft.json
        continue-on-error: true
      - name: OSV-Scanner (SHA-pinned action → reports/raw/osv-scanner.json)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --format=json
            --output=reports/raw/osv-scanner.json
            --recursive
            ./
        continue-on-error: true
      - name: Grype vulnerability scan (SHA-pinned action, SBOM-first → reports/raw/grype.json)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: reports/sbom.spdx.json
          output-format: json
          output-file: reports/raw/grype.json
          fail-build: false
        continue-on-error: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ hashFiles('**/package.json') != '' && 'javascript-typescript,actions' || 'actions' }}
        continue-on-error: true
      - name: Analyze with CodeQL (SARIF to codeql-results; no upload)
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          output: codeql-results
          upload: false
        continue-on-error: true
      - name: Repository hygiene + IaC audits (audit wrappers; no-op if binary absent — never fake)
        run: |
          mkdir -p reports/raw
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/audit-github-actions-pins.sh --output reports/raw/github-actions-pins.json || true
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/audit-docker-base-digest.sh --output reports/raw/docker-base-digest.json || true
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/audits/checkov.sh reports/raw/checkov.json || true
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/audits/conftest.sh reports/raw/conftest.json || true
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/audits/terrascan.sh reports/raw/terrascan.json || true
      - name: Run the main tool plan (profile-driven)
        # No `|| true`: run-tool-plan exits 3/4 when a REQUIRED tool is unavailable or its
        # runner crashed. Swallowing that lets the release gate enforce on partial evidence.
        run: |
          set -eu
          PROFILE=$(grep -E '^SENTINEL_SHIELD_PROJECT_TYPE=' reports/sentinel-shield-gates.env 2>/dev/null | head -n1 | sed 's/^SENTINEL_SHIELD_PROJECT_TYPE=//')
          [ -n "$PROFILE" ] || PROFILE=laravel-react-docker
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/run-tool-plan.sh \
            --profile "$PROFILE" --target . --stage main --output-dir reports/raw
      - name: Build summary + enforce
        run: |
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/build-security-summary.sh --profile "$(grep -E '^SENTINEL_SHIELD_PROJECT_TYPE=' reports/sentinel-shield-gates.env | head -n1 | sed 's/^SENTINEL_SHIELD_PROJECT_TYPE=//')" --stage main --target . --raw-dir reports/raw --output reports/security-summary.json
          sh ${{ env.SENTINEL_SHIELD_PATH }}/scripts/enforce-gates.sh --summary reports/security-summary.json --gates-env reports/sentinel-shield-gates.env --output-dir reports --format all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()   # preserve raw reports even when the gate fails on real findings
        with: { name: sentinel-shield-main, path: reports/**, retention-days: 30, if-no-files-found: warn }
